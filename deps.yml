# =============================================================================
# adb-bin-box — dependency manifest (Tier 2 static cross-built libraries)
# =============================================================================
# Schema: build/gen/schema.json ($defs/depEntry) | Semantics: system_design.md §3.3
#
# Only libraries that a tool *cannot* build without are listed here.  Each is
# cross-compiled once per ABI into a shared prefix ($WORK/prefix/<abi>) and then
# consumed via CPPFLAGS/LDFLAGS/PKG_CONFIG_PATH (system_design.md §3.6).
#
# Dependency tiers (system_design.md §1.4):
#   Tier 0  zig's musl libc is enough        (strace, iperf)
#   Tier 1  cut optional deps                (curl, stress-ng)
#   Tier 2  statically cross-build the rest  (htop -> ncurses; curl -> openssl)
# =============================================================================
version: 1

deps:
  # ---------------------------------------------------------------------------
  # ncurses — REQUIRED by htop (Tier 2). Wide-char variant only, no shared libs,
  # no programs / tests / manpages (keeps cross-build simple and fast).
  # pc-files are enabled so htop's pkg-config probe finds `ncursesw`.
  # ---------------------------------------------------------------------------
  - id: ncurses
    version: "6.5"
    repo: mirror/ncurses
    source:
      type: tarball
      url: "https://ftp.gnu.org/gnu/ncurses/ncurses-{version}.tar.gz"
      # ftp.gnu.org is the single origin here and it does time out from GitHub's
      # runners: 2026-11-01 lost ncdu/x86_64 to four consecutive 30 s connection
      # timeouts. kernel.org serves a byte-identical copy of the same release.
      # Same reasoning as zlib's fallback — a lone origin turns "the network had
      # a bad minute" into a red job, and a red job blocks the whole release.
      mirror: "https://mirrors.kernel.org/gnu/ncurses/ncurses-{version}.tar.gz"
      strip_components: 1
    build_system: autotools
    static: true
    provides: [ncursesw, ncurses]
    configure:
      flags:
        - "--enable-static"
        - "--disable-shared"
        - "--without-shared"
        - "--enable-widec"
        # Install the wide-char headers straight into $PREFIX/include instead of
        # $PREFIX/include/ncursesw. Without this, every plain
        # AC_CHECK_HEADERS([ncurses.h]) fails (there is no top-level ncurses.h),
        # which is what broke ncdu, nethogs and mtr on the first CI run. Tools
        # that use pkg-config still work because -I$PREFIX/include is in CPPFLAGS
        # for every build.
        - "--enable-overwrite"
        - "--enable-pc-files"
        - "--with-pkg-config-libdir=$PREFIX/lib/pkgconfig"
        - "--without-debug"
        - "--without-ada"
        - "--without-manpages"
        - "--without-tests"
        - "--without-progs"
        - "--disable-db-install"
        - "--disable-stripping"
    notes: "ncursesw static only; --without-progs avoids running host tic during a cross build."

  # ---------------------------------------------------------------------------
  # zlib — small, no autotools traps; used as the first proving ground for the
  # deps mechanism (curl/stress-ng can both consume it).  Uses zlib's own
  # configure script via the `make` driver's CONFIGURE_COMMAND.
  # ---------------------------------------------------------------------------
  - id: zlib
    version: "1.3.1"
    repo: madler/zlib
    source:
      type: tarball
      url: "https://zlib.net/fossils/zlib-{version}.tar.gz"
      # zlib.net is a genuine single point of failure: under the parallel load of
      # 100 matrix jobs it has twice answered 200 with an ~11 KB HTML error page
      # for the 1.5 MB tarball, three retries in a row. curl -f cannot see that,
      # so the fetch layer validates the archive with tar -tf and now also has a
      # fallback origin (the upstream GitHub release asset, byte-identical).
      mirror: "https://github.com/madler/zlib/releases/download/v{version}/zlib-{version}.tar.gz"
      strip_components: 1
    build_system: make
    static: true
    provides: [zlib]
    configure:
      command: "./configure --prefix=$PREFIX --static"
    notes: "Static libz.a only; consumed via -L$PREFIX/lib -lz."

  # ---------------------------------------------------------------------------
  # libpcap — REQUIRED by tcpdump / mtr / nethogs (Tier 2, see tools.yml).
  # Everything that pulls a *new* dependency (libnl, dbus, rdma, bluetooth, usb,
  # netmap, rpcapd) is switched off: none of it exists in a musl static build and
  # each one adds a host-side probe that can silently succeed against the HOST
  # headers and then fail at link time.
  # ---------------------------------------------------------------------------
  - id: libpcap
    version: "1.10.5"
    repo: the-tcpdump-group/libpcap
    source:
      type: tarball
      url: "https://www.tcpdump.org/release/libpcap-{version}.tar.gz"
      strip_components: 1
    build_system: autotools
    static: true
    provides: [libpcap]
    configure:
      flags:
        - "--enable-static"
        - "--disable-shared"
        - "--without-libnl"
        - "--disable-dbus"
        - "--disable-rdma"
        - "--disable-bluetooth"
        - "--disable-usb"
        - "--disable-netmap"
        - "--disable-remote"
        - "--without-dag"
        - "--without-septel"
        - "--without-snf"
        - "--without-dpdk"
        - "--without-turbocap"
    notes: "Static libpcap.a only. `--without-libnl` is mandatory: libnl is not in the dep pool and Android has no netlink headers matching libpcap's expectations."

  # ---------------------------------------------------------------------------
  # openssl — now enabled (Tier 2). Consumers: curl (features:[tls]), drill,
  # stunnel, and rsync/dropbear optionally.
  #
  # OpenSSL has NO autotools and does NOT support out-of-tree (VPATH) builds.
  # That is fine here because deps.sh always builds in-source (BUILD_DIR ==
  # SRC_DIR); the script driver's ./Configure runs in $SRC_DIR as required, and
  # the real targets are expressed through make.targets/install_target instead of
  # being chained inside the configure command (deps.sh maps an empty
  # install_target back to "install", so leaving it empty is NOT "skip").
  # ---------------------------------------------------------------------------
  - id: openssl
    version: "3.5.4"
    repo: openssl/openssl
    source:
      type: tarball
      url: "https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz"
      strip_components: 1
    build_system: script
    static: true
    provides: [openssl, libcrypto, libssl]
    configure:
      # TWO non-obvious traps, both verified against openssl 3.5.4's Configure:
      #
      # 1) `LDFLAGS= ./Configure` is mandatory. This engine exports
      #    LDFLAGS="-static -L$PREFIX/lib", and Configure contains:
      #        if (grep { /(^|\s)-static(\s|$)/ } @{$config{LDFLAGS}}) {
      #            disable('static', 'pic', 'threads');
      #        }
      #    i.e. a bare -static silently turns THREAD SUPPORT OFF. The resulting
      #    configuration.h lacks OPENSSL_THREADS, and stunnel then dies with
      #    "OpenSSL library compiled without thread support". Clearing LDFLAGS for
      #    this one command keeps threads on; the library is still static because
      #    no-shared means .a is the only artefact.
      #
      # 2) `--libdir=lib` is mandatory. The linux-* targets default to lib64 on
      #    64-bit ABIs, but the engine only ever adds -L$PREFIX/lib and
      #    PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig, so ldns's `-lcrypto` link test
      #    failed ("OpenSSL found ... but version 0.9.7 or higher is required").
      #
      # Configure also has NO out-of-tree support, hence the script driver: deps
      # are always built in-source, so BUILD_DIR == SRC_DIR here.
      command: "LDFLAGS= ./Configure no-shared no-tests no-legacy no-asm no-docs --libdir=lib --prefix=\"$PREFIX\" --openssldir=\"$PREFIX/ssl\" linux-aarch64"
    make:
      targets: ["build_sw"]
      install_target: "install_sw"
    abi_overrides:
      arm64-v8a:   { configure: { command: "LDFLAGS= ./Configure no-shared no-tests no-legacy no-asm no-docs --libdir=lib --prefix=\"$PREFIX\" --openssldir=\"$PREFIX/ssl\" linux-aarch64" } }
      armeabi-v7a: { configure: { command: "LDFLAGS= ./Configure no-shared no-tests no-legacy no-asm no-docs --libdir=lib --prefix=\"$PREFIX\" --openssldir=\"$PREFIX/ssl\" linux-armv4" } }
      x86_64:      { configure: { command: "LDFLAGS= ./Configure no-shared no-tests no-legacy no-asm no-docs --libdir=lib --prefix=\"$PREFIX\" --openssldir=\"$PREFIX/ssl\" linux-x86_64" } }
      # 3) x86 and 64-bit atomics. crypto/threads_pthread.c implements
      #    CRYPTO_atomic_add64/and/or/load/store as
      #        if (__atomic_is_lock_free(sizeof(*val), val)) { __atomic_*_fetch(...) }
      #    On 32-bit x86 clang cannot prove lock-freedom and emits a call to
      #    __atomic_is_lock_free, and zig ships NO libatomic (verified locally
      #    against zig 0.16.0: `-latomic` fails identically). `apps/openssl` then
      #    dies with "ld.lld: error: undefined symbol: __atomic_is_lock_free",
      #    which takes out BOTH consumers of libcrypto on this ABI (drill/x86 and
      #    stunnel/x86).
      #
      #    `-mcx16` alone is NOT enough: i386 aligns uint64_t to 4 bytes, and a
      #    pointer whose alignment clang cannot trust forces the runtime call no
      #    matter which atomics the target has. Reproduced locally in that exact
      #    shape — 4-byte-aligned uint64_t + -mcx16 still fails to link.
      #
      #    So the x86 build also #defines the builtin — but to 0, not 1. With 0
      #    every call site takes openssl's pthread-mutex fallback, so the runtime
      #    behaviour is exactly what a real libatomic would give for a 4-byte
      #    aligned uint64_t (its __atomic_is_lock_free answers 0 there), while
      #    -mcx16 is still what makes the *compiled but untaken* atomic branch
      #    inline to cmpxchg8b instead of leaving a __atomic_*_8 libcall
      #    undefined. Defining it to 1 also links, but it forces the atomic path
      #    on a pointer whose alignment clang just told us it cannot trust, and
      #    stunnel/x86 then died in smoke with SIGSEGV before printing anything.
      #    Both halves verified in the same local repro.
      x86:         { configure: { command: "sed -i '1i #define __atomic_is_lock_free(sz, ptr) 0' crypto/threads_pthread.c && LDFLAGS= ./Configure no-shared no-tests no-legacy no-asm no-docs --libdir=lib --prefix=\"$PREFIX\" --openssldir=\"$PREFIX/ssl\" linux-elf -mcx16" } }
    notes: "`no-asm` trades ~10-20% AES/SHA throughput for a build with no per-ABI perlasm/nasm wiring. Consumers: drill (libcrypto/libssl) and stunnel. Both need LDFLAGS cleared and --libdir=lib (see configure)."

  # ---------------------------------------------------------------------------
  # pcre (PCRE1) — REQUIRED by ngrep only. PCRE2 is a different, incompatible
  # library; ngrep 1.47 links -lpcre. UTF + UCP are on because packet payloads
  # are arbitrary bytes and Unicode property matching is cheap to enable.
  # The source is a SourceForge mirror URL; fetch uses `curl -fL` so the 302
  # to a rotating mirror is handled.
  # ---------------------------------------------------------------------------
  - id: pcre
    version: "8.45"
    repo: pcre/pcre
    source:
      type: tarball
      url: "https://downloads.sourceforge.net/project/pcre/pcre/{version}/pcre-{version}.tar.gz"
      strip_components: 1
    build_system: autotools
    static: true
    provides: [pcre]
    configure:
      flags:
        - "--enable-static"
        - "--disable-shared"
        - "--enable-utf"
        - "--enable-unicode-properties"
        - "--disable-cpp"
        - "--disable-pcregrep-libz"
        - "--disable-pcregrep-libbz2"
    notes: "PCRE1 only (ngrep links -lpcre). Keep --disable-cpp: we only need the C API and the C++ wrapper drags in stdc++."
