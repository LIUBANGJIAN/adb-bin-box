# Reusable workflow: build ONE tool × ONE ABI end to end.
#
# Called by build.yml / release.yml with one matrix entry each.  It is *the*
# only place the build actually happens — no build logic is duplicated in the
# calling workflows (system_design.md §4.2).
name: _build-tool

on:
  workflow_call:
    inputs:
      tool_id:
        required: true
        type: string
      abi:
        required: true
        type: string
      zig_target:
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-24.04
      job_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # Single source of truth for the pinned zig version (system_design.md §8).
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: ${{ inputs.job_name || format('{0}-{1}', inputs.tool_id, inputs.abi) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            make autoconf automake libtool pkg-config gettext bison xz-utils

      # Restore the zig toolchain, its *global* cache (F3: first libc compile per
      # target takes minutes) and the per-ABI dependency prefix.
      - name: Cache zig + caches + dep prefix
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig
            ${{ runner.temp }}/zig-cache-global
            ${{ runner.temp }}/work/prefix/${{ inputs.abi }}
          key: zig-${{ env.ZIG_VERSION }}-${{ inputs.abi }}-${{ hashFiles('tools.yml', 'deps.yml') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-${{ inputs.abi }}-
            zig-${{ env.ZIG_VERSION }}-

      - name: Install zig ${{ env.ZIG_VERSION }}
        run: |
          bash build/local/install-zig.sh \
            --version "$ZIG_VERSION" \
            --dir "$RUNNER_TEMP/zig"

      # Register binfmt so foreign-arch binaries run under qemu-user in the
      # smoke test (system_design.md §1.2 / F4).
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build ${{ inputs.job_name || inputs.tool_id }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          set +e
          bash build/engine/build.sh \
            --tool "${{ inputs.tool_id }}" \
            --abi  "${{ inputs.abi }}" \
            --manifest tools.yml \
            --deps deps.yml \
            --root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/work" \
            --dist "$GITHUB_WORKSPACE/dist" 2>&1 | tee "$LOG"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            echo "::error::build failed status=$status tool=${{ inputs.tool_id }} abi=${{ inputs.abi }}"
            printf '::error::error lines:%s\n' \
              "$(grep -n -E ':[0-9]+:[0-9]+: (error|fatal error):|error: |Error [0-9]+$|undefined reference|cannot find -|No such file or directory' "$LOG" | tail -n 16 | cut -c1-220 | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'BEGIN{ORS="%0A"}{print}')"
            printf '::error::log tail:%s\n' \
              "$(tail -n 18 "$LOG" | cut -c1-200 | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'BEGIN{ORS="%0A"}{print}')"
            # Self-diagnosis: print the include-path flags the generated
            # sub-Makefile actually ended up with, plus configure's
            # bundled-header probe result.  Both would have answered the strace
            # btrfs failure without spending a second CI run.
            SUBMK="$RUNNER_TEMP/work/build/${{ inputs.tool_id }}/${{ inputs.abi }}/src/Makefile"
            if [ -f "$SUBMK" ]; then
              printf '::error::effective flags:%s\n' \
                "$(grep -n -E '^(AM_CPPFLAGS|CPPFLAGS|bundled_CPPFLAGS|am__append_1) *=' "$SUBMK" | cut -c1-600 | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'BEGIN{ORS="%0A"}{print}')"
            fi
            printf '::error::bundled-header probe:%s\n' \
              "$(grep -n -m2 -i 'bundled linux kernel headers' "$LOG" | cut -c1-300 | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
          exit "$status"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist__${{ inputs.tool_id }}__${{ inputs.abi }}
          path: dist/${{ inputs.tool_id }}/${{ inputs.abi }}/
          if-no-files-found: error
          retention-days: 14
