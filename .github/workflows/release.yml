# Release pipeline: a `v*` tag, a weekly schedule, or a manual run builds and
# publishes GitHub Release assets (system_design.md §4.4).
#
# Behaviour worth knowing:
#   * one archive per tool (see build/package/package.sh);
#   * the release body is generated from the artifacts by
#     build/package/release_notes.sh — it documents the direct AND the
#     https://gh-proxy.com/ accelerated download URLs;
#   * every publish PURGES older releases (keeping only the one being created),
#     so the Releases page always shows only the newest version;
#   * the weekly run (Sunday 20:17 Asia/Shanghai) tags itself with the date of
#     the Sunday it was scheduled for, e.g. v2026.11.01, and adds -r2/-r3 if
#     that tag already exists.
name: release

on:
  push:
    tags:
      - "v*"
  # Weekly build+release. GitHub cron is UTC; 12:17 UTC == 20:17 in Asia/Shanghai,
  # which is still Sunday in both zones, so the date in the tag is unambiguous.
  #
  # 17 past the hour, not on the hour: GitHub's scheduler is best-effort and the
  # top of every hour is its busiest slot — runs scheduled at :00 are the ones
  # that get delayed by tens of minutes. Anything inside the first minutes of a
  # delay window still lands on the intended Sunday.
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty = v<VERSION> from the VERSION file)"
        required: false
        default: ""
      tools:
        description: "Comma-separated tool ids to build (empty = all)"
        required: false
        default: ""
      abis:
        description: "Comma-separated ABI subset (empty = all)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Resolve the tag/version, validate manifests, emit the matrix.
  # --------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # Weekly run: name the release after the Sunday it was *scheduled*
            # for, not the day the runner happened to start.
            #
            # GitHub's cron is best-effort — a 12:17 UTC run can sit queued for
            # hours. Past 16:00 UTC it is already Monday in Asia/Shanghai, so
            # dating the tag from "now" would publish v<Monday> for a Sunday
            # build (and the next Sunday would then collide differently).
            # Anchoring on the most recent Sunday keeps the tag stable for any
            # delay shorter than a week.
            #
            # A same-day re-run must not fight over an existing tag, so fall
            # back to -r2, -r3, ... (`ls-remote` returns non-zero when the tag
            # is absent, which ends the loop).
            DOW="$(TZ=Asia/Shanghai date +%u)"          # 1=Mon .. 7=Sun
            BACK=$(( (DOW - 7 + 7) % 7 ))
            BASE="v$(TZ=Asia/Shanghai date -d "-${BACK} days" +%Y.%m.%d)"
            TAG="$BASE"
            for n in 2 3 4 5 6; do
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                TAG="${BASE}-r${n}"
              else
                break
              fi
            done
          else
            TAG="v$(tr -d ' \t\r\n' < VERSION)"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved release tag=$TAG version=$VERSION (event=${GITHUB_EVENT_NAME})" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate manifests
        run: python build/gen/manifest.py validate --tools tools.yml --deps deps.yml

      - name: Generate matrix
        id: matrix
        env:
          ABIS: ${{ github.event.inputs.abis }}
          TOOLS: ${{ github.event.inputs.tools }}
        run: |
          python build/gen/generate_matrix.py tools.yml \
            --deps deps.yml \
            ${ABIS:+--abis "$ABIS"} \
            ${TOOLS:+--only "$TOOLS"} \
            --to-github-output "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 2. Build every selected (tool, abi).
  # --------------------------------------------------------------------------
  build:
    name: build
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_build-tool.yml
    with:
      tool_id: ${{ matrix.tool_id }}
      abi: ${{ matrix.abi }}
      zig_target: ${{ matrix.zig_target }}
      runner: ${{ matrix.runner }}
      job_name: ${{ matrix.job_name }}
      build_system: ${{ matrix.build_system }}

  # --------------------------------------------------------------------------
  # 3. Package, purge older releases, publish.
  # --------------------------------------------------------------------------
  release:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: _arts

      - name: Reconstruct dist/
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in _arts/dist__*; do
            base="$(basename "$d")"
            rest="${base#dist__}"
            tool="${rest%%__*}"
            abi="${rest#*__}"
            mkdir -p "dist/$tool/$abi"
            cp -f "$d"/* "dist/$tool/$abi/"
          done
          find dist -type f -printf '%p\n' | sort

      - name: Package (tag version wins, one archive per tool)
        env:
          REL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash build/package/package.sh \
            --dist dist --out dist/_packages --version "$REL_VERSION" --clean

      - name: Build release notes
        env:
          REL_TAG: ${{ needs.prepare.outputs.tag }}
          REL_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash build/package/release_notes.sh \
            --packages dist/_packages \
            --repo "${{ github.repository }}" \
            --tag "$REL_TAG" \
            --version "$REL_VERSION" \
            --out dist/_packages/RELEASE_NOTES.md \
            --proxy "https://gh-proxy.com/"

      # Publish FIRST, purge second.
      #
      # The purge used to run before this step, which meant a failed upload (rate
      # limit, network, a bad archive) left the repository with ZERO releases:
      # the old one was already deleted and the new one never appeared. Creating
      # the release first makes the weekly run non-destructive — if publishing
      # fails, the previous version is still downloadable.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "adb-bin-box ${{ needs.prepare.outputs.tag }}"
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: dist/_packages/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/_packages/*.tar.gz
            dist/_packages/SHA256SUMS
            dist/_packages/manifest.json

      # Delete every OTHER release, so only the newest survives. Never touches
      # KEEP_TAG (the tag we just published).
      - name: Purge old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          echo "keeping tag: $KEEP_TAG"
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/old_tags.txt || true
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ "$t" = "$KEEP_TAG" ]; then
              echo "skip (current): $t"
              continue
            fi
            echo "deleting old release: $t"
            gh release delete "$t" --yes --cleanup-tag || echo "  (skip $t)"
          done < /tmp/old_tags.txt
          echo "purge done"
