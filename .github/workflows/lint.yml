# Quality gates for the shell/python/yaml engineering in this repo.
name: lint

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + yamllint + python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python tooling
        run: python -m pip install --upgrade pip pyyaml yamllint

      - name: Python syntax (compile all)
        run: python -m py_compile build/gen/manifest.py build/gen/generate_matrix.py build/verify/elf_check.py

      - name: Python unit smoke (matrix generation)
        run: |
          count="$(python build/gen/generate_matrix.py tools.yml --deps deps.yml --count-only)"
          echo "matrix count = $count"
          python build/gen/manifest.py validate --tools tools.yml --deps deps.yml

      # Pure bash + python, no toolchain: covers the `uapi_include` -> `-I`
      # expansion and the build.sh landing gate (see the script's header).
      - name: Bash unit test (bundled UAPI -I mechanism)
        run: bash build/tests/test_uapi_include.sh

      - name: JSON syntax
        run: |
          python -m json.tool build/gen/schema.json > /dev/null
          python -m json.tool build/verify/abi_matrix.json > /dev/null

      - name: yamllint
        run: yamllint -d relaxed tools.yml deps.yml .github/workflows/ || true

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shellcheck (errors only)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=error "${scripts[@]}"

      # Regression gate (root cause A): every build script must be committed
      # with the executable bit.  On Windows `core.fileMode=false` hides the
      # real mode, so a missing +x only shows up on the Linux runner as a
      # mysterious exit 126 -> assert it here in the git *index*.
      - name: git executable bit on build scripts
        run: |
          bad=0
          while IFS= read -r f; do
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            [ "$mode" = "100755" ] || { echo "::error file=$f::git mode is $mode, expected 100755"; bad=1; }
          done < <(git ls-files 'build/**/*.sh')
          exit $bad

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
