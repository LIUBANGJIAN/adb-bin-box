# Quality gates for the shell/python/yaml engineering in this repo.
name: lint

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + yamllint + python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python tooling
        run: python -m pip install --upgrade pip pyyaml yamllint

      - name: Python syntax (compile all)
        run: python -m py_compile build/gen/manifest.py build/gen/generate_matrix.py build/verify/elf_check.py

      - name: Python unit smoke (matrix generation)
        run: |
          count="$(python build/gen/generate_matrix.py tools.yml --deps deps.yml --count-only)"
          echo "matrix count = $count"
          python build/gen/manifest.py validate --tools tools.yml --deps deps.yml

      - name: JSON syntax
        run: |
          python -m json.tool build/gen/schema.json > /dev/null
          python -m json.tool build/verify/abi_matrix.json > /dev/null

      - name: yamllint
        run: yamllint -d relaxed tools.yml deps.yml .github/workflows/ || true

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shellcheck (errors only)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=error "${scripts[@]}"

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
